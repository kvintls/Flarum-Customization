<script>
/* 让加载转圈彻底无感：任何含 "LoadingIndicator" 的元素一插入 DOM 就立刻隐藏。
   用 MutationObserver 在元素出现的同一帧就处理，用户看不到转圈。 */
(function(){
  function killSpinners(root){
    if(!root || !root.querySelectorAll) return;
    var sel = '[class*="LoadingIndicator"], .LoadingIndicator';
    if(root.matches && root.matches(sel)) root.style.setProperty('display','none','important');
    root.querySelectorAll(sel).forEach(function(e){ e.style.setProperty('display','none','important'); });
  }
  function start(){
    if(!document.body){ return setTimeout(start, 20); }
    killSpinners(document.body);
    new MutationObserver(function(muts){
      for(var i=0;i<muts.length;i++){
        var a=muts[i].addedNodes;
        for(var j=0;j<a.length;j++){ if(a[j].nodeType===1) killSpinners(a[j]); }
      }
    }).observe(document.body, {childList:true, subtree:true});
  }
  start();
})();
</script>

<script>
/* 注册/登录一律走整页：拦截 Flarum 原生「注册」「登录」按钮，改为跳转 /register 或 /login */
(function(){
  document.addEventListener('click', function(e){
    if(!e.target.closest) return;
    var reg = e.target.closest('.item-signUp a, .item-signUp button, .Button--signup');
    if(reg){ e.preventDefault(); e.stopPropagation(); window.location = '/register'; return; }
    var login = e.target.closest('.item-logIn a, .item-logIn button');
    if(login){ e.preventDefault(); e.stopPropagation(); window.location = '/login'; return; }
  }, true);

  // 兼容旧链接 /?login=1 —— 直接跳到整页登录

})();

<script>
/* 帖子行：用内联样式强制四列(优先级最高,压过CSS) + 最后发帖改「时间 由 用户名 发布」*/
(function(){
  setInterval(function(){
    document.querySelectorAll('.DiscussionListItem-content').forEach(function(c){
      var main = c.querySelector('.DiscussionListItem-main');
      var title = c.querySelector('.DiscussionListItem-title');
      var count = c.querySelector('.DiscussionListItem-count');
      var views = c.querySelector('.item-discussion-views');
      var terminal = c.querySelector('.item-terminalPost');
      // 彻底确定性布局：把 4 个单元格按顺序直接挂到 content 下
      // (DOM 顺序 = flex 从左到右)，不再依赖 display:contents / order
      // 只有当顺序被打乱时才重排(避免每次轮询都动 DOM 造成闪烁/抖动)
      var ordered = main && count && views && terminal &&
        main.parentElement === c &&
        count.previousElementSibling === main &&
        views.previousElementSibling === count &&
        terminal.previousElementSibling === views;
      if(!ordered && main && count && views && terminal){
        c.style.setProperty('display','flex','important');
        main.style.display = '';
        c.appendChild(main);       // 1) 标题区
        c.appendChild(count);      // 2) 回复
        c.appendChild(views);      // 3) 浏览量
        c.appendChild(terminal);   // 4) 最后一篇帖子
        // 内联 !important 强制每列位置/宽度(压过一切 CSS，含 Flarum 的 position:absolute 气泡)
        main.style.setProperty('order','1','important');
        main.style.setProperty('flex','1 1 auto','important');
        main.style.setProperty('min-width','0','important');
        count.style.setProperty('position','static','important');
        count.style.setProperty('order','2','important');
        count.style.setProperty('flex','0 0 70px','important');
        count.style.setProperty('margin','0','important');
        count.style.setProperty('display','flex','important');
        count.style.setProperty('align-items','center','important');
        count.style.setProperty('justify-content','center','important');
        count.style.setProperty('background','none','important');
        count.style.setProperty('box-shadow','none','important');
        count.style.setProperty('top','auto','important');
        count.style.setProperty('right','auto','important');
        views.style.setProperty('position','static','important');  // 关键:插件把它设成了 absolute
        views.style.setProperty('top','auto','important');
        views.style.setProperty('right','auto','important');
        views.style.setProperty('order','3','important');
        views.style.setProperty('flex','0 0 90px','important');
        views.style.setProperty('display','flex','important');
        views.style.setProperty('align-items','center','important');
        views.style.setProperty('justify-content','center','important');
        terminal.style.setProperty('order','4','important');
        terminal.style.setProperty('flex','0 0 240px','important');
        terminal.style.setProperty('text-align','left','important');
      }
      // 标题后加「由 发帖人」(仿图三 Arch: Title by username)，填充话题列
      var author = c.querySelector('.DiscussionListItem-author');
      if(title && author && !title.querySelector('.kv-by')){
        var al = (author.getAttribute('aria-label') || '').trim();
        var starter = al.split('发布')[0].trim();
        if(!starter) starter = al.split(/\s+/)[0];
        if(starter){
          var by = document.createElement('span');
          by.className = 'kv-by';
          by.textContent = ' 由 ' + starter;
          title.appendChild(by);
        }
      }
      // 列位置由 CSS(order/flex-basis)接管，这里不再设内联 grid 样式
      // 最后发帖改成：时间 由 用户名 发布
      if(terminal && !terminal.querySelector('.kv-lp-user')){
        var time = terminal.querySelector('time');
        var unameEl = terminal.querySelector('.username');
        if(time && unameEl){
          var uname = unameEl.textContent.trim();
          terminal.innerHTML = '';
          terminal.appendChild(time);
          terminal.appendChild(document.createTextNode(' 由 '));
          var u = document.createElement('span');
          u.className = 'username kv-lp-user';
          u.textContent = uname;
          terminal.appendChild(u);
          terminal.appendChild(document.createTextNode(' 发布'));
        }
      }
    });
  }, 200);
})();
</script>

<script>
/* 自动生成唯一头像(identicon)：给没有上传真实头像的用户，按用户名确定性地生成一张唯一的
   GitHub 风格图案头像(纯前端、无需外网、无需扩展)。已上传真实头像(img)的用户保持不变。 */
(function(){
  function hash(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
  function identicon(seed){
    var h=hash(seed), hue=h%360, fg='hsl('+hue+',58%,52%)', r=h;
    function nx(){ r=(Math.imul(r,1103515245)+12345)>>>0; return r; }
    var rects='';
    for(var x=0;x<3;x++){ for(var y=0;y<5;y++){
      if(nx()&1){
        rects+='<rect x="'+(x*20)+'" y="'+(y*20)+'" width="20" height="20"/>';
        if(x<2){ rects+='<rect x="'+((4-x)*20)+'" y="'+(y*20)+'" width="20" height="20"/>'; }
      }
    }}
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#eef0f2"/><g fill="'+fg+'">'+rects+'</g></svg>';
    return 'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));
  }
  function seedFor(av){
    var a = av.closest && av.closest('a[href*="/u/"]');
    if(a){ var m=a.getAttribute('href').match(/\/u\/([^\/?#]+)/); if(m) return decodeURIComponent(m[1]); }
    var txt=(av.textContent||'').trim();
    return txt + '|' + (av.getAttribute('style')||'') + getComputedStyle(av).backgroundColor;
  }
  setInterval(function(){
    document.querySelectorAll('.Avatar').forEach(function(av){
      if(av.dataset.kvIdent) return;
      if(av.tagName==='IMG' || av.querySelector('img')){ av.dataset.kvIdent='1'; return; } // 已有真实头像
      var seed=seedFor(av); if(!seed) return;
      av.style.backgroundImage='url("'+identicon(seed)+'")';
      av.style.backgroundSize='cover';
      av.style.backgroundColor='transparent';
      av.style.color='transparent';
      av.dataset.kvIdent='1';
    });
  }, 500);
})();
</script>



<script>
/* 主题详情页(/d/...)：把浮动的回复 composer 变成内联——移动到主题白卡内(页脚之前)，
   并加 .kv-inline 类由 CSS 去掉浮动/拖拽/最小化。其它页面保持原样。 */
(function(){
  setInterval(function(){
    var comp = document.querySelector('.App-composer');
    if(!comp) return;
    if(/^\/d\//.test(location.pathname)){
      var stream = document.querySelector('.DiscussionPage-stream');
      if(stream){
        comp.classList.add('kv-inline'); // 先加类,保证虚线/内联样式一定生效(即使下面搬动出错)
        try{
          var footer = stream.querySelector('#kvin-footer2');
          if(footer && footer.parentElement === stream){
            if(comp.nextElementSibling !== footer) stream.insertBefore(comp, footer);
          } else if(comp.parentElement !== stream){
            stream.appendChild(comp);
          }
        }catch(e){}
        comp.style.setProperty('padding-left','0','important');
        comp.style.setProperty('padding-right','0','important');
        // 真正的元凶：App-composer 里的 .container(站点栏宽/内边距)把回复框挤窄了 → 清掉
        var cont = comp.querySelector('.container');
        if(cont){
          cont.style.setProperty('max-width','none','important');
          cont.style.setProperty('width','100%','important');
          cont.style.setProperty('padding-left','0','important');
          cont.style.setProperty('padding-right','0','important');
          cont.style.setProperty('margin','0','important');
        }
        var cc = comp.querySelector('.Composer');
        if(cc){
          cc.style.setProperty('width','100%','important');
          cc.style.setProperty('max-width','none','important');
          cc.style.setProperty('margin-left','0','important');
          cc.style.setProperty('margin-right','0','important');
          cc.style.setProperty('box-sizing','border-box','important');
        }
      }
    } else {
      comp.classList.remove('kv-inline');
    }
  }, 300);
})();
</script>

<script>
/* (已移除)之前用 JS 清空输入框来去掉 @引用，会与 Flarum 编辑器状态不同步、导致
   "回复尚未发布/丢弃吗"弹窗且回复框打不开。改为不干预，保留 Flarum 原生引用。 */
</script>
