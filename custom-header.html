<script>
/* 让加载转圈彻底无感：任何含 "LoadingIndicator" 的元素一插入 DOM 就立刻隐藏。
   用 MutationObserver 在元素出现的同一帧就处理，用户看不到转圈。 */
(function(){
  function killSpinners(root){
    if(!root || !root.querySelectorAll) return;
    var sel = '[class*="LoadingIndicator"], .LoadingIndicator';
    if(root.matches && root.matches(sel)) root.style.setProperty('display','none','important');
    root.querySelectorAll(sel).forEach(function(e){ e.style.setProperty('display','none','important'); });
  }
  function start(){
    if(!document.body){ return setTimeout(start, 20); }
    killSpinners(document.body);
    new MutationObserver(function(muts){
      for(var i=0;i<muts.length;i++){
        var a=muts[i].addedNodes;
        for(var j=0;j<a.length;j++){ if(a[j].nodeType===1) killSpinners(a[j]); }
      }
    }).observe(document.body, {childList:true, subtree:true});
  }
  start();
})();
</script>

<script>
/* 注册/登录一律走整页：拦截 Flarum 原生「注册」「登录」按钮，改为跳转 /register 或 /login */
(function(){
  document.addEventListener('click', function(e){
    if(!e.target.closest) return;
    var reg = e.target.closest('.item-signUp a, .item-signUp button, .Button--signup');
    if(reg){ e.preventDefault(); e.stopPropagation(); window.location = '/register'; return; }
    var login = e.target.closest('.item-logIn a, .item-logIn button');
    if(login){ e.preventDefault(); e.stopPropagation(); window.location = '/login'; return; }
  }, true);

  // 兼容旧链接 /?login=1 —— 直接跳到整页登录
  if(/[?&]login=1\b/.test(location.search)){ window.location = '/login'; }
})();

<script>

<script>
/* v2 帖子行布局: 标题 + 图标元信息行 (发帖人 / 浏览量 / 讨论量 / 最后回复人 / 时间)
   + 右侧板块 tag. 发帖人和最后回复人可点击, SPA 路由直达 /u/username.
   数据源: 从 Flarum 原来的 .DiscussionListItem-author / .item-discussion-views /
   .DiscussionListItem-count / .item-terminalPost / .item-tags 里读, 原元素被 CSS
   隐掉但 DOM 保留 (方便 Flarum 自己更新数据, 我们下一轮再同步过来). */
(function(){
  function makeUserLink(name){
    var s = document.createElement('span');
    s.className = 'kv-userlink';
    s.dataset.uname = name;
    s.textContent = name;
    return s;
  }
  function makeTagLink(name, href, bg, fg){
    var s = document.createElement('span');
    s.className = 'kv-taglink';
    s.dataset.href = href || '';
    s.textContent = name;
    if(bg) s.style.background = bg;
    if(fg) s.style.color = fg;
    return s;
  }
  function metaLi(icon, node){
    var li = document.createElement('li');
    if(icon){
      var i = document.createElement('i');
      i.className = 'fas fa-' + icon;
      li.appendChild(i);
      li.appendChild(document.createTextNode(' '));
    }
    if(typeof node === 'string') li.appendChild(document.createTextNode(node));
    else if(node) li.appendChild(node);
    return li;
  }
  function extractNum(el){
    if(!el) return '';
    var m = (el.textContent || '').match(/\d+/);
    return m ? m[0] : '';
  }
  // 点击处理: 拦截 .kv-userlink / .kv-taglink, 用 SPA 路由跳 (避免触发父级 <a> 到帖子详情)
  document.addEventListener('click', function(e){
    var ul = e.target.closest && e.target.closest('.kv-userlink');
    if(ul){
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      var url = '/u/' + encodeURIComponent(ul.dataset.uname);
      if(window.app && app.route && app.route.set){ app.route.set(url); }
      else { window.location = url; }
      return;
    }
    var tl = e.target.closest && e.target.closest('.kv-taglink');
    if(tl){
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      var url = tl.dataset.href || '/';
      if(window.app && app.route && app.route.set){ app.route.set(url); }
      else { window.location = url; }
      return;
    }
  }, true);

  setInterval(function(){
    document.querySelectorAll('.DiscussionList-discussions .DiscussionListItem-content').forEach(function(c){
      var main  = c.querySelector('.DiscussionListItem-main');
      var title = c.querySelector('.DiscussionListItem-title');
      if(!main || !title) return;

      // 清掉 v1 遗留的内联 !important (一次性, 免得跟新 CSS 打架)
      if(!c.dataset.kvV2Reset){
        [c, main, title,
         c.querySelector('.DiscussionListItem-count'),
         c.querySelector('.item-discussion-views'),
         c.querySelector('.item-terminalPost')].forEach(function(el){
          if(!el) return;
          ['display','flex','order','position','top','right','left','margin',
           'padding','align-items','justify-content','background','box-shadow',
           'min-width','width','height','border-radius','text-align','white-space',
           'overflow','text-overflow','flex-basis','flex-grow','flex-shrink']
            .forEach(function(p){ el.style.removeProperty(p); });
        });
        c.dataset.kvV2Reset = '1';
      }

      // 采集数据
      var authorEl = c.querySelector('.DiscussionListItem-author');
      var starter = '';
      if(authorEl){
        var al = (authorEl.getAttribute('aria-label') || '').trim();
        starter = (al.split('发布')[0] || '').trim();
        if(!starter) starter = (al.split(/\s+/)[0] || '').trim();
      }
      var viewsStr = extractNum(c.querySelector('.item-discussion-views'));
      var countStr = extractNum(c.querySelector('.DiscussionListItem-count'));
      var terminal = c.querySelector('.item-terminalPost');
      var lastUser = '';
      var lastTime = '';
      if(terminal){
        var lu = terminal.querySelector('.username');
        var lt = terminal.querySelector('time');
        if(lu) lastUser = (lu.textContent || '').trim();
        if(lt) lastTime = (lt.textContent || '').trim();
      }
      // Tag: 可能在标题里, 也可能在 info 列表里
      var tagEl = c.querySelector('.item-tags .TagLabel, .DiscussionListItem-title .TagLabel, .DiscussionListItem-info .TagLabel');
      var tagName = tagEl ? (tagEl.textContent || '').trim() : '';
      var tagHref = tagEl && tagEl.getAttribute ? (tagEl.getAttribute('href') || '') : '';
      var tagBg = '', tagFg = '';
      if(tagEl){
        var st = tagEl.getAttribute('style') || '';
        var bm = st.match(/background(?:-color)?\s*:\s*([^;]+)/i);
        var fm = st.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);
        if(bm) tagBg = bm[1].trim();
        if(fm) tagFg = fm[1].trim();
      }

      // 签名: 数据没变就跳过 (防闪烁)
      var sig = starter + '|' + viewsStr + '|' + countStr + '|' + lastUser + '|' + lastTime + '|' + tagName;
      if(c.dataset.kvSig === sig) return;
      c.dataset.kvSig = sig;

      // 清 v1 遗留的 kv-by
      title.querySelectorAll('.kv-by').forEach(function(el){ el.remove(); });

      // 构建/更新 meta 元信息行 (标题下方)
      var meta = main.querySelector(':scope > .kv-meta');
      if(!meta){
        meta = document.createElement('ul');
        meta.className = 'kv-meta';
        main.appendChild(meta);
      }
      meta.innerHTML = '';
      if(starter)  meta.appendChild(metaLi('user',    makeUserLink(starter)));
      if(viewsStr) meta.appendChild(metaLi('eye',     viewsStr));
      meta.appendChild(metaLi('comment', countStr || '0'));
      if(lastUser) meta.appendChild(metaLi('bolt',    makeUserLink(lastUser)));
      if(lastTime) meta.appendChild(metaLi('',        lastTime));

      // 构建/更新 右侧 tag 列
      var tagCol = c.querySelector(':scope > .kv-list-tag');
      if(!tagCol){
        tagCol = document.createElement('div');
        tagCol.className = 'kv-list-tag';
        c.appendChild(tagCol);
      }
      tagCol.innerHTML = '';
      if(tagName){ tagCol.appendChild(makeTagLink(tagName, tagHref, tagBg, tagFg)); }
      // 保证 tag 列在最右 (order:2 也管, 但 DOM 顺序更稳)
      if(c.lastElementChild !== tagCol) c.appendChild(tagCol);
    });
  }, 400);
})();
</script>

<script>
/* 卡通头像 (DiceBear) —— 给没有上传真实头像的用户按用户名确定性生成卡通人物头像
   - 有真实头像 (Flarum <img>) 的用户完全不动
   - 首次访问: fetch DiceBear SVG (10KB 上下), 存 localStorage
   - 二次访问: 直接读缓存, 零网络请求
   - DiceBear 不通/慢时先用几何 identicon 兜底显示, fetch 回来再无感替换
   要换头像风格改下面 STYLE 变量; 顺便把 CACHE_VER 加一下, 老缓存会自动作废.
   可选风格 (v9): avataaars | adventurer | micah | notionists | open-peeps
                   big-smile | fun-emoji | personas | croodles | lorelei | pixel-art */
(function(){
  var STYLE       = 'avataaars';   // 默认: Sketch 风格卡通人物 (男女/发型/肤色/配饰各种组合)
  var BG_COLORS   = 'b6e3f4,c0aede,d1d4f9,ffd5dc,ffdfbf,ffe4b2';  // 随机背景色池
  var CACHE_VER   = 'v3';
  var CACHE_PREFIX = 'kv-avatar:' + CACHE_VER + ':' + STYLE + ':';

  // ---- 兜底: 老的几何 identicon (只在网络失败时展示) ----
  function hash(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
  function identiconFallback(seed){
    var h=hash(seed), hue=h%360, fg='hsl('+hue+',58%,52%)', r=h;
    function nx(){ r=(Math.imul(r,1103515245)+12345)>>>0; return r; }
    var rects='';
    for(var x=0;x<3;x++){ for(var y=0;y<5;y++){
      if(nx()&1){
        rects+='<rect x="'+(x*20)+'" y="'+(y*20)+'" width="20" height="20"/>';
        if(x<2){ rects+='<rect x="'+((4-x)*20)+'" y="'+(y*20)+'" width="20" height="20"/>'; }
      }
    }}
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#eef0f2"/><g fill="'+fg+'">'+rects+'</g></svg>';
    return 'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));
  }

  function seedFor(av){
    var a = av.closest && av.closest('a[href*="/u/"]');
    if(a){ var m=a.getAttribute('href').match(/\/u\/([^\/?#]+)/); if(m) return decodeURIComponent(m[1]); }
    var txt = (av.textContent||'').trim();
    return txt + '|' + (av.getAttribute('style')||'') + getComputedStyle(av).backgroundColor;
  }

  var mem = {};       // seed -> data URL (内存缓存, 避 localStorage 反复读)
  var pending = {};   // seed -> [avatar 元素...] (fetch 中的排队, 防重复请求)

  function apply(av, dataUrl){
    av.style.backgroundImage = 'url("' + dataUrl + '")';
    av.style.backgroundSize  = 'cover';
    av.style.backgroundColor = 'transparent';
    av.style.color           = 'transparent';
  }

  function load(seed, av){
    // (1) 内存缓存命中
    if(mem[seed]){ apply(av, mem[seed]); return; }
    // (2) localStorage 命中
    var key = CACHE_PREFIX + seed;
    try{
      var cached = localStorage.getItem(key);
      if(cached){ mem[seed] = cached; apply(av, cached); return; }
    }catch(e){}
    // (3) 需要 fetch —— 但先用几何 identicon 兜底避免空白
    var stub = identiconFallback(seed);
    apply(av, stub);
    if(pending[seed]){ pending[seed].push(av); return; }
    pending[seed] = [av];
    var url = 'https://api.dicebear.com/9.x/' + STYLE + '/svg' +
              '?seed=' + encodeURIComponent(seed) +
              '&backgroundColor=' + BG_COLORS +
              '&size=120';
    fetch(url, { credentials: 'omit' })
      .then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(svg){
        var dataUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
        mem[seed] = dataUrl;
        try{ localStorage.setItem(key, dataUrl); }catch(e){/* quota 满 or 隐私模式 */}
        (pending[seed] || []).forEach(function(el){ apply(el, dataUrl); });
        delete pending[seed];
      })
      .catch(function(){
        // 网络失败: 保留 identicon 兜底, 记忆到内存, 下次会话再试
        mem[seed] = stub;
        (pending[seed] || []).forEach(function(el){ apply(el, stub); });
        delete pending[seed];
      });
  }

  setInterval(function(){
    document.querySelectorAll('.Avatar').forEach(function(av){
      if(av.dataset.kvIdent) return;
      if(av.tagName === 'IMG' || av.querySelector('img')){ av.dataset.kvIdent = '1'; return; } // 已有真实头像
      var seed = seedFor(av); if(!seed) return;
      av.dataset.kvIdent = '1';
      load(seed, av);
    });
  }, 500);
})();
</script>



<script>
/* 回复框(composer)内联化 + 防闪退 —— 这就是用户实测有效的 "v4" 逻辑固化版。
   思路: 只在"帖子数增加"(=真发帖成功)时把 composer 移出帖子流到 .App, 并进入约1.2s
   冷却; 冷却期不动 DOM 位置, 让 Flarum/Mithril 完整重绘帖子流(此刻 composer 不在流里,
   不会 DOM 错位闪退)。冷却结束后每轮自动把 composer 归位到帖子流(页脚 #kvin-footer2 之前
   的虚线区)。不监听点击(避免"点回复就跳到外面"), 位置每轮自愈(避免隔次跑偏)。 */
(function(){
  var app = document.querySelector('.App');
  var cooldown = 0;      // >0 期间不塞回帖子流(发帖后重绘窗口)
  var wasOpen = false;   // 上一轮 composer 是否打开, 用于侦测"开->关"的转变(=发帖成功)
  var lastPath = location.pathname;

  // 【修复"第一次点回复没反应"】焦点若卡在某个按钮上(常见 fof-upload-button 等),
  // 浏览器会阻止 Flarum 给 #app 加 aria-hidden 打开回复框("Blocked aria-hidden ...
  // Element with focus"), 结果第一次点看不见框, 第二次点因焦点已移开才正常。
  // 修法: 在点"回复/编辑/发主题"按钮时, 先把当前焦点主动清掉。
  document.addEventListener('mousedown', function(e){
    if(!e.target.closest) return;
    var trig = e.target.closest('.item-reply, .item-edit, .item-newDiscussion, .Post-actions .Button, .ReplyPlaceholder, [data-item-name="reply"], [data-item-name="edit"]');
    if(trig){
      var el = document.activeElement;
      if(el && el !== document.body && el.blur){ try{ el.blur(); }catch(_){} }
    }
  }, true);

  setInterval(function(){
    var comp = document.querySelector('.App-composer');
    if(!comp){ wasOpen = false; return; }
    if(!app) app = document.querySelector('.App');
    var open = !!comp.querySelector('.Composer');

    // 换页(进新话题)时清冷却, 状态干净
    if(location.pathname !== lastPath){ cooldown = 0; lastPath = location.pathname; }

    // 内联类只在打开时加, 关了去掉。composer 的显示/隐藏交给 Flarum 自己管。
    if(open){ comp.classList.add('kv-inline'); }
    else { comp.classList.remove('kv-inline'); }

    // 【发帖信号】composer "从开->关"的转变 = 用户刚发布了回复(不是取消、不是切页,
    // 因为那两种情况前面已经处理)。此时把 composer park 到 .App 并进入短冷却, 让 Flarum
    // 完整重绘帖子流。这个信号比"帖子数变化"可靠得多——后者会被懒加载/骨架填充误触发。
    if(wasOpen && !open){
      if(app && comp.parentElement !== app){ try{ app.appendChild(comp); }catch(e){} }
      cooldown = 6; // 约1.2秒
    }
    wasOpen = open;

    if(cooldown > 0){ cooldown--; return; } // 冷却期不动位置

    // 平时: composer 打开时 -> 归位到当前页面的白卡内(页脚之前的虚线区)
    //  - /d/ 详情页 : 白卡 = .DiscussionPage-stream
    //  - /t/ 板块页 : 白卡 = .IndexPage-results  (发新主题也要在白卡内, 不能跑到框外)
    if(open){
      var host = null;
      if(/^\/d\//.test(location.pathname)){
        host = document.querySelector('.DiscussionPage-stream');
      } else if(/^\/t\//.test(location.pathname) || location.pathname === '/'){
        host = document.querySelector('.IndexPage-results');
      }
      if(host && comp.parentElement !== host){
        try{
          var footer = host.querySelector('#kvin-footer2');
          if(footer && footer.parentElement === host){ host.insertBefore(comp, footer); }
          else { host.appendChild(comp); }
        }catch(e){}
      }
    }
  }, 200);
})();
</script>



<script>
/* 彻底禁掉离开/刷新页面时的"重新加载/是否离开"确认弹窗(beforeunload)。
   注意代价: 真有未发布的回复草稿时刷新/关页面也不再提示, 内容会直接丢失。(用户选择 B 方案) */
(function(){
  // 1) 拦截 addEventListener 注册的 beforeunload 处理器, 直接不注册
  var _add = window.addEventListener;
  window.addEventListener = function(type){
    if(String(type).toLowerCase() === 'beforeunload'){ return; }
    return _add.apply(this, arguments);
  };
  // 2) 保险: 若已有 onbeforeunload / 之后被赋值, 都强制返回空(不弹框)
  try{ window.onbeforeunload = null; }catch(e){}
  try{
    Object.defineProperty(window, 'onbeforeunload', {
      configurable:true,
      get:function(){ return null; },
      set:function(){ /* 忽略任何赋值, 保证永不弹框 */ }
    });
  }catch(e){}
  // 3) 兜底: 捕获阶段拦截 beforeunload, 阻止默认确认框
  _add.call(window, 'beforeunload', function(e){
    e.stopImmediatePropagation();
    delete e.returnValue;
  }, true);
})();
</script>

<script>
/* 新建主题的 composer: 把提交按钮标签从「发布主题」改为「发布帖子」
   —— 只改新建主题(有 title 输入框)的 composer, 回复框不受影响。
   同时兼容 Button-label / 纯文本 两种结构; 会保留按钮里的 icon 节点。 */
(function(){
  setInterval(function(){
    var comp = document.querySelector('.App-composer');
    if(!comp) return;
    // 判定是不是"新建主题" composer: DiscussionComposer / 有标题输入框
    var isNewDiscussion = !!(
      comp.querySelector('.DiscussionComposer') ||
      comp.querySelector('.DiscussionComposer-title') ||
      comp.querySelector('input[name="title"]') ||
      comp.querySelector('.ComposerBody-header input.FormControl')
    );
    if(!isNewDiscussion) return;
    var btn = comp.querySelector('.Composer-footer .Button--primary')
           || comp.querySelector('.TextEditor-controls .Button--primary')
           || comp.querySelector('.Button--primary');
    if(!btn) return;
    var lbl = btn.querySelector('.Button-label');
    if(lbl){
      if((lbl.textContent||'').trim() !== '发布帖子'){ lbl.textContent = '发布帖子'; }
    } else {
      // 无 .Button-label 结构: 直接改按钮里的文本节点(保留 icon 等元素节点)
      var changed = false;
      for(var i=0;i<btn.childNodes.length;i++){
        var n = btn.childNodes[i];
        if(n.nodeType === 3 && n.textContent && n.textContent.trim()){
          if(n.textContent.trim() !== '发布帖子'){ n.textContent = '发布帖子'; }
          changed = true;
          break;
        }
      }
      if(!changed && (btn.textContent||'').trim() !== '发布帖子'){
        btn.textContent = '发布帖子';
      }
    }
  }, 200);
})();
</script>

<script>
/* 用美观居中弹窗替换删除时的原生 confirm。只拦"删除"类确认,其它确认走原生不受影响。 */
(function(){
  var bypass = false, lastBtn = null;
  var orig = window.confirm.bind(window);
  document.addEventListener('click', function(e){
    if(e.target.closest && e.target.closest('.kv-confirm-overlay')) return; // 不记录美化弹窗自身的按钮
    var el = e.target.closest && e.target.closest('button, a');
    if(el) lastBtn = el;
  }, true);
  window.confirm = function(msg){
    if(bypass) return true;
    showModal(msg);   // 所有原生 confirm(删除/丢弃回复等)都换成美化弹窗
    return false;
  };
  function closeModal(){ var o = document.querySelector('.kv-confirm-overlay'); if(o) o.parentNode.removeChild(o); }
  function showModal(msg){
    closeModal();
    var ov = document.createElement('div');
    ov.className = 'kv-confirm-overlay';
    ov.innerHTML = '<div class="kv-confirm-box"><div class="kv-confirm-head">提示</div><div class="kv-confirm-msg"></div><div class="kv-confirm-btns"><button type="button" class="kv-confirm-cancel">取消</button><button type="button" class="kv-confirm-ok">确定删除</button></div></div>';
    ov.querySelector('.kv-confirm-msg').textContent = msg;
    ov.querySelector('.kv-confirm-ok').textContent = /删除|刪除|delete/i.test(msg||'') ? '确定删除' : '确定';
    document.body.appendChild(ov);
    ov.querySelector('.kv-confirm-cancel').onclick = closeModal;
    ov.querySelector('.kv-confirm-ok').onclick = function(){
      closeModal();
      if(lastBtn){ bypass = true; try{ lastBtn.click(); }catch(e){} bypass = false; }
    };
    ov.onclick = function(e){ if(e.target === ov) closeModal(); };
  }
})();
</script>

<script>
/* 贡献榜: 表头 = 贡献榜/用户/贡献认同/加载更多 4列, 第4列用 rowspan 撑满整表 = 加载更多垂直居中
   —— 原生底部按钮容器 .rankings-loadmore 由 CSS 隐藏 (Mithril 碰不到CSS, 就不会在点击后闪现) */
(function(){
  setInterval(function(){
    var tbl=document.querySelector('table.rankings');
    if(!tbl) return;
    /* 表头文字规范化(排名/贡献人 -> 贡献榜, 👍 -> 贡献认同; 我加的第4列 th 跳过) */
    tbl.querySelectorAll('th').forEach(function(th){
      if(th.classList.contains('kv-loadmore-th')) return;
      var t=(th.textContent||'').trim();
      if(t==='排名'||t==='贡献人') th.textContent='贡献榜';
      if(t==='👍'||th.querySelector('i.fa-thumbs-up,.fa-thumbs-up')) th.textContent='贡献认同';
    });
    /* 表头行末尾加 <th class=kv-loadmore-th>加载更多</th>(幂等) */
    var thRow=tbl.querySelector('tr');
    if(thRow&&!thRow.querySelector('.kv-loadmore-th')){
      var lth=document.createElement('th');
      lth.className='kv-loadmore-th';
      lth.textContent='加载更多';
      lth.onclick=function(){
        document.querySelectorAll('button').forEach(function(b){
          if((b.textContent||'').trim()==='加载更多'&&!b.classList.contains('kv-loadmore-th')) b.click();
        });
      };
      thRow.appendChild(lth);
    }
    /* 表头行插入 <th class=kv-time-th>最新更新时间</th>, 位置在 kv-loadmore-th 前(幂等) */
    if(thRow&&!thRow.querySelector('.kv-time-th')){
      var tth=document.createElement('th');
      tth.className='kv-time-th';
      tth.textContent='最新更新时间';
      var beforeEl=thRow.querySelector('.kv-loadmore-th');
      if(beforeEl) thRow.insertBefore(tth,beforeEl);
      else thRow.appendChild(tth);
    }
    /* 更新 加载更多 th 的 rowspan = 表头 + 所有数据行 */
    var lth=thRow?thRow.querySelector('.kv-loadmore-th'):null;
    if(lth){
      var total=tbl.querySelectorAll('tr').length;
      if(lth.getAttribute('rowspan')!==String(total)) lth.setAttribute('rowspan',total);
    }
    /* 数据行末尾加 <td class=kv-time-td>时间</td>, 从 app.store 查用户 lastSeenAt */
    tbl.querySelectorAll('tr').forEach(function(tr){
      if(tr.querySelector('th')) return;
      if(tr.querySelector('.kv-time-td')) return;
      var td=document.createElement('td');
      td.className='kv-time-td';
      var text='-';
      try{
        var link=tr.querySelector('a[href*="/u/"]');
        var m=link&&(link.getAttribute('href')||'').match(/\/u\/([^\/\?#]+)/);
        if(m&&window.app&&app.store){
          var uname=decodeURIComponent(m[1]);
          var users=app.store.all('users')||[];
          for(var i=0;i<users.length;i++){
            if(users[i]&&users[i].username&&users[i].username()===uname){
              var t=users[i].lastSeenAt&&users[i].lastSeenAt();
              if(t){
                var diff=(Date.now()-t.getTime())/1000;
                if(diff<60) text='刚刚';
                else if(diff<3600) text=Math.floor(diff/60)+'分钟前';
                else if(diff<86400) text=Math.floor(diff/3600)+'小时前';
                else text=Math.floor(diff/86400)+'天前';
              }
              break;
            }
          }
        }
      }catch(e){}
      td.textContent=text;
      tr.appendChild(td);
    });
    /* 清掉上一版加过的空 4th td(用 rowspan 后就不需要了) */
    tbl.querySelectorAll('td.kv-more-td').forEach(function(td){td.remove();});
    /* 拆除历史 kv-rank-wrap 残留 */
    var w=tbl.parentElement;
    if(w&&w.classList.contains('kv-rank-wrap')){
      var gp=w.parentElement;
      if(gp){gp.insertBefore(tbl,w);w.remove();}
    }
    /* 所有改动都做完 -> 加 kv-ready 类让 CSS 显示表格(切页/初次加载时避免露出原始"排名|用户|👍") */
    tbl.classList.add('kv-ready');
  },50);
})();
</script>



<script>
/* Locale-aware translation for extension modals that ship without Chinese
   strings in the language pack (flarum-tags' "Choose tags to follow" flow, etc.).
   Rule: only translate when the browser language starts with "zh" (Chinese).
   English or other browsers see Flarum's default English -- no interference. */
(function(){
  var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
  if(lang.indexOf('zh') !== 0) return; // Non-Chinese browsers: do nothing.

  var dict = {
    'Choose tags to follow': '选择要关注的标签',
    'Continue to forum': '继续访问论坛',
    'Remind me later': '稍后提醒',
    'Follow': '关注',
    'Unfollow': '取消关注',
    'Choose primary tags': '选择主标签',
    'Choose secondary tags': '选择次标签',
    'Skip': '跳过',
    'Next': '下一步',
    'Back': '返回',
    'Submit': '提交',
    'Save changes': '保存修改',
    'Save Changes': '保存修改'
  };

  function tryTranslate(el){
    // Only replace TEXT nodes and buttons/spans whose entire trimmed text matches a key.
    var scope = el.querySelectorAll('*');
    for(var i = 0; i < scope.length; i++){
      var n = scope[i];
      // Skip inputs/textarea to not mess with typed content
      if(/^(INPUT|TEXTAREA)$/.test(n.tagName)) continue;
      // Direct text-only elements
      if(n.children.length === 0 && n.textContent){
        var t = n.textContent.trim();
        if(dict[t]){ n.textContent = n.textContent.replace(t, dict[t]); }
      }
    }
    // Also inspect direct text nodes of the container itself
    for(var c = el.firstChild; c; c = c.nextSibling){
      if(c.nodeType === 3 && c.textContent){
        var t = c.textContent.trim();
        if(dict[t]){ c.textContent = c.textContent.replace(t, dict[t]); }
      }
    }
  }

  // Target the tags-related modals + any modal in general (safe: only exact-match keys)
  setInterval(function(){
    var modals = document.querySelectorAll(
      '.ChooseTagsToFollowModal, .SubscriptionMenuModal, .SubscribeMenuModal, ' +
      '.NotificationMenuModal, .SelectTagsModal, .TagDiscussionModal, .Modal-content'
    );
    modals.forEach(tryTranslate);
  }, 300);
})();
</script>




<script>
/* Silently remove the ChooseTagsToFollow and Subscription modals as soon as
   they open. IMPORTANT: do NOT call app.modal.close() -- that triggers
   Flarum's internal close handlers which may fire backend API calls (save
   preferences, follow-tags, etc.) that regular users lack permission for,
   causing "您没有权限进行此操作" errors even for logged-in users.
   Instead we directly tear down the DOM: remove the modal + any backdrop
   + unlock body scroll -- all fully client-side, zero API calls. */
(function(){
  setInterval(function(){
    var m = document.querySelector('.ChooseTagsToFollowModal, .SubscriptionModal');
    if(!m) return;
    try{
      m.remove();
      document.querySelectorAll('.Modal-backdrop, .modal-backdrop').forEach(function(b){ b.remove(); });
      document.body.classList.remove('modal-open');
      document.body.style.overflow = '';
      document.body.style.paddingRight = '';
      var mm = document.querySelector('.ModalManager');
      if(mm){ mm.classList.remove('in','fade','modal'); mm.style.display = 'none'; }
    }catch(e){}
  }, 100);
})();
</script>




<script>
/* 客户端图片压缩 —— 在浏览器里压完再上传, 服务器零 CPU 消耗
   ------------------------------------------------------------------
   触发: 任何走 fetch / XMLHttpRequest 且 body 是 FormData 且里面含
         image/* 类型 File 的上传请求 (fof/upload 走 XHR, 全捕获)
   处理: 长边 > 1920px 时等比缩到 1920px, 重编 JPEG quality 0.85
   跳过: 原文件 < 300KB 的图 (不划算); 或者 GIF / SVG (会丢动画/矢量)
   兜底: 压后比原图大 -> 上传原图 (无损兜底, 决不会变更差)
   注意: PNG 带透明会转成 JPEG 平底 —— 若含通透头像等再考虑保留 PNG.
   日志: 每次压完在 Console 打一行 "原大小 -> 新大小", 方便观察效果. */
(function(){
  var MAX_DIM = 1920;
  var QUALITY = 0.85;
  var MIN_SIZE = 300 * 1024;

  function compress(file){
    return new Promise(function(resolve){
      try{
        if(!/^image\//.test(file.type)){ resolve(file); return; }
        // GIF / SVG / ICO 原样上传 (会丢动画或矢量)
        if(/^image\/(gif|svg\+xml|x-icon|vnd\.microsoft\.icon)$/i.test(file.type)){ resolve(file); return; }
        if(file.size < MIN_SIZE){ resolve(file); return; }
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function(){
          try{
            URL.revokeObjectURL(url);
            var w = img.naturalWidth || img.width;
            var h = img.naturalHeight || img.height;
            if(!w || !h){ resolve(file); return; }
            if(w > MAX_DIM || h > MAX_DIM){
              if(w >= h){ h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
              else       { w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
            }
            var c = document.createElement('canvas');
            c.width = w; c.height = h;
            var ctx = c.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            // 白底填充: PNG 透明区转 JPEG 会变黑, 先铺白底
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            c.toBlob(function(blob){
              if(!blob){ resolve(file); return; }
              if(blob.size >= file.size){
                try{ console.log('[kv-compress] ' + file.name + ' 压后反而更大, 保留原图 (' + Math.round(file.size/1024) + ' KB)'); }catch(_){}
                resolve(file); return;
              }
              var newName = file.name.replace(/\.\w+$/, '') + '.jpg';
              var nf = new File([blob], newName, { type: 'image/jpeg', lastModified: Date.now() });
              try{
                console.log('[kv-compress] ' + file.name + ': ' +
                  Math.round(file.size/1024) + ' KB -> ' + Math.round(nf.size/1024) + ' KB (' +
                  Math.round(nf.size/file.size*100) + '%, ' + w + 'x' + h + ')');
              }catch(_){}
              resolve(nf);
            }, 'image/jpeg', QUALITY);
          }catch(err){ resolve(file); }
        };
        img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
        img.src = url;
      }catch(err){ resolve(file); }
    });
  }

  function processFD(fd){
    try{
      var pairs = [];
      var it = fd.entries();
      while(true){
        var r = it.next();
        if(r.done) break;
        pairs.push(r.value);
      }
      var any = pairs.some(function(p){ return p[1] instanceof File && /^image\//.test(p[1].type); });
      if(!any) return Promise.resolve(fd);
      var nfd = new FormData();
      return Promise.all(pairs.map(function(p){
        var k = p[0], v = p[1];
        if(v instanceof File && /^image\//.test(v.type)){
          return compress(v).then(function(cf){ nfd.append(k, cf, cf.name); });
        }
        nfd.append(k, v);
        return Promise.resolve();
      })).then(function(){ return nfd; });
    }catch(e){ return Promise.resolve(fd); }
  }

  // fetch 拦截 (Flarum 2.x / 部分扩展走这条)
  if(typeof window.fetch === 'function'){
    var _fetch = window.fetch;
    window.fetch = function(input, init){
      try{
        if(init && init.body instanceof FormData){
          var self = this;
          return processFD(init.body).then(function(fd){
            var ni = Object.assign({}, init, { body: fd });
            return _fetch.call(self, input, ni);
          });
        }
      }catch(e){}
      return _fetch.apply(this, arguments);
    };
  }

  // XMLHttpRequest.send 拦截 (Flarum 1.x m.request / fof-upload 都走这条)
  var _send = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.send = function(body){
    try{
      if(body instanceof FormData){
        var xhr = this;
        processFD(body).then(function(fd){ _send.call(xhr, fd); });
        return;
      }
    }catch(e){}
    return _send.apply(this, arguments);
  };
})();
</script>




<script>
/* 帖子正文图片相册化 —— 两条规则合一:
   (1) 先文字后图片: 无论作者怎么写, 所有 <img> 一律搬到 .Post-body 末尾
   (2) 一行最多 3 张, 3 等分列宽 (第1张左 / 第2张中 / 第3张右)
       4张+ 自动换行, 依然按左->中->右填充
   实现: 每轮 setInterval 扫每个 .Post-body, 把没进 grid 的 <img> 连带最外层
   <a href> 一起 appendChild 到 .kv-imggrid (grid 容器) 里, grid 挂在 Post-body
   的最末尾. 原来的段落如果被抽空就顺手删掉, 不留空白段.
   idempotent: 靠 :not(.kv-imggrid img) 的过滤保证已经进 grid 的不再动. */
(function(){
  setInterval(function(){
    document.querySelectorAll('.Post-body').forEach(function(body){
      try{
        var imgs = Array.from(body.querySelectorAll('img')).filter(function(img){
          if(img.closest('.kv-imggrid')) return false;
          // 排除 emoji/表情包 (保持内联小图, 不进 grid):
          //  - Flarum 内置 twemoji: class="emoji"
          //  - fof/emoji: class="fof-emoji"
          //  - alt 是 :xxx: 形式的
          //  - 我们自己的 tieba/aru 两个 CDN
          if(img.classList){
            if(img.classList.contains('emoji')) return false;
            if(img.classList.contains('fof-emoji')) return false;
          }
          if((img.getAttribute('alt')||'').match(/^:[\w+-]+:$/)) return false;
          var src = img.getAttribute('src') || '';
          if(src.indexOf('cdn.jsdelivr.net/gh/liopoos/aru-sticker') !== -1) return false;
          if(src.indexOf('cdn.jsdelivr.net/gh/KBdog/emojiCDN')  !== -1) return false;
          // 其它一律当"真照片", 进 grid (无论有没有 <a> 外壳)
          return true;
        });
        if(imgs.length === 0) return;
        var grid = body.querySelector(':scope > .kv-imggrid');
        if(!grid){
          grid = document.createElement('div');
          grid.className = 'kv-imggrid';
          body.appendChild(grid);
        }
        // 保证 grid 永远是 body 的最后一个子节点 (即使有人在后面又插了新段落)
        if(body.lastElementChild !== grid){ body.appendChild(grid); }
        imgs.forEach(function(img){
          var a = img.closest('a[href]');
          var moveEl = (a && body.contains(a)) ? a : img;
          if(moveEl.parentElement === grid) return;
          var oldParent = moveEl.parentElement;
          grid.appendChild(moveEl);
          // 老段落被抽空了(既没文字也没其它多媒体) -> 删掉, 不留空白段
          if(oldParent && oldParent !== body && oldParent !== grid &&
             !(oldParent.textContent || '').replace(/[\s\u00A0\uFEFF]+/g, '') &&
             !oldParent.querySelector('img,video,iframe,audio,button,input,picture')){
            oldParent.remove();
          }
        });
      }catch(e){}
    });
  }, 500);
})();
</script>



<script>
/* 自定义表情面板: 三个 tab (泡泡 / 阿鲁 / 颜文字)
   - 干掉 Flarum 原生的 emoji picker (那个"regional_indicator_a"的下拉)
   - 点笑脸按钮 -> 弹出我们的面板 (定位在按钮上方)
   - 点图片表情: 往 composer textarea 插入 markdown ![](url), 会渲染成图片
   - 点颜文字: 直接插入字符 (纯文本)
   
   素材来源 (全部走 jsdelivr CDN, 引用第三方公开托管仓库, 不重打包):
   - 泡泡: KBdog/emojiCDN 的 tieba 目录 (贴吧原生表情, 61 张)
   - 阿鲁: liopoos/aru-sticker 的 image 目录 (281 张)
   如果这两个 CDN 挂了/慢了, 也可以自己 fork 一份到自己的仓库改 URL. */
(function(){
  // === 数据 ===
  var PAOPAO_NAMES = ['OK','haha','what','不高兴','乖','你懂的','便便','勉强','吐','吐舌','呀咩爹','呵呵','哈哈','啊','喷','大拇指','太开心','太阳','委屈','小乖','小红脸','彩虹','心碎','怒','惊哭','惊讶','懒得理','手纸','挖鼻','捂嘴笑','星星月亮','汗','沙发','泪','滑稽','灯泡','爱心','犀利','狂汗','玫瑰','疑问','真棒','睡觉','礼物','笑尿','笑眼','红领巾','胜利','花心','茶杯','药丸','蛋糕','蜡烛','鄙视','酷','酸爽','钱币','阴险','音乐','香蕉','黑线'];
  var ARU_COUNT = 281;
  var KAOMOJI = [
    '(๑•̀ㅁ•́ฅ)','(´｡• ω •｡`)','¯\\_(ツ)_/¯','(◍•ᴗ•◍)','ヾ(≧▽≦*)o',
    '(´,,•ω•,,)♡','(｡◕‿◕｡)','(◕‿◕✿)','٩( ᐛ )و','(・_・?)',
    '(；￣Д￣)','(◎_◎;)','(╯°□°）╯︵ ┻━┻','(ノಠ益ಠ)ノ','(˘•_•˘)',
    'ಥ_ಥ','(っ °Д °;)っ','(ಥ﹏ಥ)','٩(◕‿◕)۶','(ﾉ◕ヮ◕)ﾉ*:･ﾟ✧',
    '(☆▽☆)','ヽ(´▽`)/','(⌒‿⌒)','(◠‿◠)','(♡´౪`♡)',
    '٩(♡ε♡ )۶','(♡◡♡)','(∪｡∪)｡｡｡zzZ','σ(≧ε≦o)','(´−｀) ンー',
    '( ͡° ͜ʖ ͡°)','(¬‿¬)','(*≧ω≦)','(＞人＜;)','(=^･ω･^=)',
    '(=①ω①=)','(๑˃̵ᴗ˂̵)و','(◐‿◑)','｡◕‿‿◕｡','(＾• ω •＾)'
  ];

  var PAOPAO_BASE = 'https://cdn.jsdelivr.net/gh/KBdog/emojiCDN@master/tieba/';
  var ARU_BASE = 'https://cdn.jsdelivr.net/gh/liopoos/aru-sticker@master/image/';

  function paopaoUrl(name){ return PAOPAO_BASE + encodeURIComponent(name) + '.png'; }
  function aruUrl(n){ return ARU_BASE + encodeURIComponent('aru (' + n + ').png'); }

  var panel = null;

  function buildPanel(){
    if(panel) return panel;
    panel = document.createElement('div');
    panel.id = 'kv-emojipanel';
    panel.innerHTML =
      '<div class="kv-ep-body"></div>' +
      '<div class="kv-ep-tabs">' +
        '<button type="button" data-pack="pao">泡泡</button>' +
        '<button type="button" data-pack="aru">阿鲁</button>' +
        '<button type="button" data-pack="kao">颜文字</button>' +
      '</div>';
    document.body.appendChild(panel);
    panel.addEventListener('click', function(e){
      var tab = e.target.closest('.kv-ep-tabs button');
      if(tab){
        panel.querySelectorAll('.kv-ep-tabs button').forEach(function(b){ b.classList.remove('active'); });
        tab.classList.add('active');
        renderPack(tab.dataset.pack);
        return;
      }
      var item = e.target.closest('[data-insert]');
      if(item){
        insertToComposer(item.dataset.insert);
        // 插完不关掉面板, 方便连发多个
        return;
      }
    });
    // 防止面板里点击冒泡到 window/document 的 "点外面关掉" 逻辑
    panel.addEventListener('mousedown', function(e){ e.stopPropagation(); });
    return panel;
  }

  function renderPack(pack){
    var body = panel.querySelector('.kv-ep-body');
    body.className = 'kv-ep-body' + (pack === 'kao' ? ' kv-ep-kao' : '');
    body.innerHTML = '';
    var frag = document.createDocumentFragment();
    if(pack === 'pao'){
      PAOPAO_NAMES.forEach(function(name){
        var url = paopaoUrl(name);
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'kv-ep-img';
        b.title = name;
        b.dataset.insert = '![](' + url + ')';
        var img = document.createElement('img');
        img.src = url; img.loading = 'lazy'; img.alt = name;
        b.appendChild(img);
        frag.appendChild(b);
      });
    } else if(pack === 'aru'){
      for(var i = 1; i <= ARU_COUNT; i++){
        var url = aruUrl(i);
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'kv-ep-img';
        b.title = 'aru' + i;
        b.dataset.insert = '![](' + url + ')';
        var img = document.createElement('img');
        img.src = url; img.loading = 'lazy'; img.alt = 'aru' + i;
        b.appendChild(img);
        frag.appendChild(b);
      }
    } else if(pack === 'kao'){
      KAOMOJI.forEach(function(text){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'kv-ep-text';
        b.dataset.insert = text;
        b.textContent = text;
        frag.appendChild(b);
      });
    }
    body.appendChild(frag);
  }

  function showPanel(anchor){
    buildPanel();
    // 首次显示默认落在泡泡
    if(!panel.querySelector('.kv-ep-tabs button.active')){
      panel.querySelector('[data-pack="pao"]').classList.add('active');
      renderPack('pao');
    }
    // 先显示成 block 才能测量尺寸
    panel.style.display = 'flex';
    panel.style.visibility = 'hidden';
    panel.style.left = '0px'; panel.style.top = '0px';
    // 等下一帧拿到真实尺寸再定位
    requestAnimationFrame(function(){
      var rect = anchor.getBoundingClientRect();
      var pw = panel.offsetWidth, ph = panel.offsetHeight;
      var top = rect.top + window.scrollY - ph - 8;
      var left = rect.left + window.scrollX - pw / 2 + rect.width / 2;
      if(left < 8) left = 8;
      if(left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
      // 上方空间不够就展开到下方
      if(top < window.scrollY + 8) top = rect.bottom + window.scrollY + 8;
      panel.style.top  = top + 'px';
      panel.style.left = left + 'px';
      panel.style.visibility = 'visible';
    });
  }

  function hidePanel(){ if(panel) panel.style.display = 'none'; }

  function insertToComposer(text){
    var ta = document.querySelector('.App-composer .Composer textarea, .App-composer textarea, .Composer textarea, .TextEditor textarea');
    if(!ta) return;
    var start = ta.selectionStart || 0;
    var end   = ta.selectionEnd   || 0;
    var v = ta.value;
    // 图片单独成行 (前后自动补换行); 颜文字直接插原文
    var isImg = /^!\[/.test(text);
    var pre = v.substring(0, start), post = v.substring(end);
    var lead  = isImg && pre  && !/\n$/.test(pre)  ? '\n' : '';
    var trail = isImg && post && !/^\n/.test(post) ? '\n' : '';
    var chunk = lead + text + trail;
    // 用原生 setter 绕过 Mithril/React 的受控组件劫持
    try{
      var setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
      setter.call(ta, pre + chunk + post);
    }catch(e){
      ta.value = pre + chunk + post;
    }
    var cursor = start + chunk.length;
    ta.selectionStart = ta.selectionEnd = cursor;
    ta.focus();
    ta.dispatchEvent(new Event('input',  { bubbles: true }));
    ta.dispatchEvent(new Event('change', { bubbles: true }));
  }

  // 拦截笑脸按钮 (capture 阶段, 抢在 Flarum 前面)
  document.addEventListener('click', function(e){
    if(!e.target.closest) return;
    // 我们自己的面板不动
    if(e.target.closest('#kv-emojipanel')) return;
    // 笑脸按钮: 兼容多个可能的选择器
    var btn = e.target.closest(
      '.TextEditor-controls .item-emoji, .item-emoji, [data-item-name="emoji"], ' +
      '.TextEditor-controls .fa-smile, .TextEditor-controls .fa-face-smile, ' +
      '.Composer .fa-smile, .Composer .fa-face-smile'
    );
    if(!btn) return;
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();
    var anchor = btn.closest('li, button') || btn;
    showPanel(anchor);
  }, true);

  // 点面板外面收起
  document.addEventListener('mousedown', function(e){
    if(!panel || panel.style.display === 'none') return;
    if(e.target.closest && e.target.closest('#kv-emojipanel')) return;
    if(e.target.closest && e.target.closest('.item-emoji, .fa-smile, .fa-face-smile, [data-item-name="emoji"]')) return;
    hidePanel();
  }, true);

  // Esc 关掉
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && panel && panel.style.display !== 'none') hidePanel();
  });
})();
</script>



<script>
/* 用户主页 (/u/name) 侧栏顶部塞一张统计卡: 加入天数 / 等级 / 贡献值
   - 加入天数: 从 user.joinTime() 实时算 (毫秒差 / 86400000)
   - 等级: 阈值表映射, 参数 XP
   - 贡献值(XP): 前端暂时靠帖子数+评论数+加入天数推导, 服务端将来接入了真正的
     签到/投喂/惩罚系统后, 把 computeXP 里的返回值换成 user.data.attributes.<字段>
     就一步到位, 显示层不用改.
   数据源: app.store.all('users') 里按 slug 匹配到当前主页用户. */
(function(){
  // ---- 参数(想调整积分曲线改这里就行) ----
  var XP_PER_DISCUSSION = 5;
  var XP_PER_COMMENT    = 1;
  var XP_PER_DAY        = 0.5;
  // 等级阈值: 需累积多少 XP 才能进这一级
  var LEVEL_XP = [0, 50, 200, 500, 1000, 2000, 4000, 7000, 12000, 20000];

  function daysSince(date){
    if(!date) return 0;
    var t = (date instanceof Date) ? date.getTime() : new Date(date).getTime();
    if(!t) return 0;
    return Math.max(0, Math.floor((Date.now() - t) / 86400000));
  }
  function computeXP(user, days){
    // 前端估算 (装了后端积分插件后替换为 user.data.attributes.chickenLegs 等)
    var d = 0, c = 0;
    try{ d = user.discussionCount ? (user.discussionCount() || 0) : 0; }catch(e){}
    try{ c = user.commentCount    ? (user.commentCount()    || 0) : 0; }catch(e){}
    return Math.max(0, Math.floor(d * XP_PER_DISCUSSION + c * XP_PER_COMMENT + days * XP_PER_DAY));
  }
  function computeLevel(xp){
    for(var i = LEVEL_XP.length - 1; i >= 0; i--){
      if(xp >= LEVEL_XP[i]) return i + 1;
    }
    return 1;
  }
  function findUser(slug){
    if(!(window.app && app.store)) return null;
    var users = app.store.all('users') || [];
    for(var i = 0; i < users.length; i++){
      try{ if(users[i].username && users[i].username() === slug) return users[i]; }catch(e){}
    }
    return null;
  }

  setInterval(function(){
    if(!/^\/u\//.test(location.pathname)) return;
    var sideNav = document.querySelector('.UserPage .sideNav');
    if(!sideNav) return;

    var m = location.pathname.match(/^\/u\/([^\/?#]+)/);
    if(!m) return;
    var slug = decodeURIComponent(m[1]);
    var user = findUser(slug);
    if(!user) return;

    var days  = user.joinTime ? daysSince(user.joinTime()) : 0;
    var xp    = computeXP(user, days);
    var level = computeLevel(xp);

    var card = sideNav.querySelector('.kv-user-stats');
    if(!card){
      card = document.createElement('div');
      card.className = 'kv-user-stats';
      card.innerHTML =
        '<div class="kv-us-item"><i class="fas fa-clock"></i><span class="kv-us-label">加入天数</span><span class="kv-us-value kv-us-days">-</span></div>' +
        '<div class="kv-us-item"><i class="fas fa-gem"></i><span class="kv-us-label">等级</span><span class="kv-us-value kv-us-level">-</span></div>' +
        '<div class="kv-us-item"><i class="fas fa-award"></i><span class="kv-us-label">贡献值</span><span class="kv-us-value kv-us-xp">-</span></div>';
      sideNav.insertBefore(card, sideNav.firstChild);
    }
    var dEl = card.querySelector('.kv-us-days');
    var lEl = card.querySelector('.kv-us-level');
    var xEl = card.querySelector('.kv-us-xp');
    if(dEl.textContent !== String(days))  dEl.textContent = String(days);
    if(lEl.textContent !== String(level)) lEl.textContent = String(level);
    if(xEl.textContent !== String(xp))    xEl.textContent = String(xp);
  }, 500);
})();
</script>
