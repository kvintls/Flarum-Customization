<div id="archbar-src" style="display:none">
  <ul>
    <li><a href="/">首页</a></li>
    <li><a href="/tags">板块</a></li>
    <li><a href="/rankings">排名</a></li>
    <li><a href="/all">全部主题</a></li>
  </ul>
  <span class="archbar-right">
    主题：<a href="/">活跃</a> | <a href="/all">未回复</a>
    <span class="ab-authwrap">
      <a href="/register" class="ab-auth">注册</a>
      <a href="/login" class="ab-auth">登录</a>
    </span>
  </span>
</div>
<script>
(function(){
  setInterval(function(){
    var box=document.querySelector('.CategoriesPage-content');
    if(box && !box.querySelector('#archbar')){
      var src=document.getElementById('archbar-src');
      if(src){var bar=src.cloneNode(true);bar.id='archbar';bar.style.display='';box.insertBefore(bar,box.firstChild);}
    }
    var loggedIn=!document.querySelector('.item-logIn');
    document.querySelectorAll('.ab-authwrap').forEach(function(e){e.style.display=loggedIn?'none':'';});
  },300);
})();
</script>

<script>
(function(){
  setInterval(function(){
    if(typeof app==='undefined' || !app.forum) return;
    var box=document.querySelector('.CategoriesPage-content');
    if(box && !document.getElementById('kvin-stats')){
      var a=app.forum.data.attributes||{};
      var d=a['fof-forum-statistics-widget.discussionsCount']||0;
      var p=a['fof-forum-statistics-widget.postsCount']||0;
      var u=a['fof-forum-statistics-widget.usersCount']||0;
      var on=a['totalOnlineUsers']||0;
      var el=document.createElement('div');
      el.id='kvin-stats';
      el.innerHTML='<div class="kvin-stats-title">统计信息</div>'+
'<div class="kvin-stats-body">'+
'<div class="ks-line"><b class="ks-h">在线用户</b>&nbsp;&nbsp;总共 <b>'+on+'</b> 人在线</div>'+
'<div class="ks-line"><b class="ks-h">统计信息</b>&nbsp;&nbsp;帖子总数 <b>'+p+'</b> | 主题总数 <b>'+d+'</b> | 用户总数 <b>'+u+'</b></div>'+
'</div>';

      box.appendChild(el);
    }
    // 页脚：始终放进当前页面的白卡里(和首页一样在框内)。哪怕之前跑到框外，也移回来。
    var footerBox = document.querySelector('.CategoriesPage-content') || document.querySelector('.IndexPage-results');
    if(footerBox){
      var ft = document.getElementById('kvin-footer2');
      if(!ft){
        ft = document.createElement('div');
        ft.id = 'kvin-footer2';
        ft.innerHTML = '由 <a href="https://flarum.org" target="_blank">Flarum</a> 提供技术支持 · © kvin 论坛';
      }
      if(ft.parentElement !== footerBox){ footerBox.appendChild(ft); }
    }

  },400);
})();
</script>

<script>

<script>
/* 版主列 = 该板块最后发帖的作者（取 .username，绝对定位盖在第4列，不影响布局） */
(function(){
  setInterval(function(){
    document.querySelectorAll('.TagCategory-subTagList > .TagCategory > .TagCategory-content').forEach(function(row){
      var mod = '';
      var u = row.querySelector('.LastDiscussion-usernameLink .username') || row.querySelector('.LastDiscussion .username') || row.querySelector('.username');
      if(u){ mod = (u.textContent || '').trim(); }
      var cell = row.querySelector('.kv-mod');
      if(!cell){
        cell = document.createElement('span');
        cell.className = 'kv-mod';
        row.appendChild(cell);
      }
      if(cell.textContent !== mod){ cell.textContent = mod; }
    });
  }, 500);
})();
</script>


<script>
/* 给注册/登录弹窗的输入框加 FluxBB 风格文字标签（用户名 * / 密码 * ...） */
(function(){
  setInterval(function(){
    document.querySelectorAll('.SignUpModal .Form-group, .LogInModal .Form-group').forEach(function(g){
      var input = g.querySelector('input.FormControl');
      if(input && !g.querySelector('.kv-flabel')){
        var ph = input.getAttribute('placeholder') || input.getAttribute('aria-label') || '';
        if(ph){
          var lb = document.createElement('label');
          lb.className = 'kv-flabel';
          lb.innerHTML = ph.replace(/</g,'&lt;') + ' <span class="kv-req">*</span>';
          g.insertBefore(lb, input);
          input.setAttribute('placeholder', ''); // 清掉重复的占位文字
        }
      }
    });
  }, 400);
})();
</script>


<script>
/* 注册/登录一律走整页：拦截 Flarum 原生「注册」「登录」按钮，改为跳转 /register 或 /login */
(function(){
  document.addEventListener('click', function(e){
    if(!e.target.closest) return;
    var reg = e.target.closest('.item-signUp a, .item-signUp button, .Button--signup');
    if(reg){ e.preventDefault(); e.stopPropagation(); window.location = '/register'; return; }
    var login = e.target.closest('.item-logIn a, .item-logIn button');
    if(login){ e.preventDefault(); e.stopPropagation(); window.location = '/login'; return; }
  }, true);

  // 兼容旧链接 /?login=1 —— 直接跳到整页登录
  if(/[?&]login=1\b/.test(location.search)){ window.location = '/login'; }
})();
</script>


<script>
/* 帖子列表页(板块)：注入面包屑 + 列头(话题|回复|浏览量|最后一篇帖子)，做成 FluxBB 表格 */
(function(){
  setInterval(function(){
    var dl = document.querySelector('.IndexPage .DiscussionList');
    if(!dl) return;

    // 列头（所有帖子列表都加）
    var ul = dl.querySelector('.DiscussionList-discussions');
    if(ul && !dl.querySelector('.kv-dlhead')){
      var head = document.createElement('div');
      head.className = 'kv-dlhead';
      head.innerHTML = '<span class="c1">话题</span><span class="c2">回复</span><span class="c3">浏览量</span><span class="c4">最后一篇帖子</span>';
      ul.parentNode.insertBefore(head, ul);
    }

    // 翻页移到「话题」表头上方（页数在话题的上边）
    var head2 = dl.querySelector('.kv-dlhead');
    var pag = dl.querySelector('.Pagination');
    if(pag && head2 && head2.previousElementSibling !== pag){
      head2.parentNode.insertBefore(pag, head2);
    }

    // 面包屑 + 发布新主题（仅板块页 /t/...）
    var isTag = /^\/t\//.test(location.pathname);
    var results = document.querySelector('.IndexPage-results') || dl.parentNode;
    if(isTag && results && !document.getElementById('kv-forumbar')){
      var name = (document.title.split(' - ')[0] || '').trim();
      var bar = document.createElement('div');
      bar.id = 'kv-forumbar';

      var crumb = document.createElement('span');
      crumb.className = 'kv-crumb';
      var home = document.createElement('a'); home.href = '/'; home.textContent = '首页';
      crumb.appendChild(home);
      crumb.appendChild(document.createTextNode(' » ' + name));

      var btn = document.createElement('button');
      btn.type = 'button'; btn.id = 'kv-newtopic'; btn.className = 'kv-newtopic'; btn.textContent = '发布新主题';
      btn.addEventListener('click', function(){
        var b = document.querySelector('.item-newDiscussion button, .IndexPage-newDiscussion, .item-newDiscussion .Button');
        if(b) b.click();
      });

      bar.appendChild(crumb);
      bar.appendChild(btn);
      results.insertBefore(bar, results.firstChild);
    }

    // 没有发帖权限时隐藏发帖按钮
    var nt = document.getElementById('kv-newtopic');
    if(nt){ nt.style.display = document.querySelector('.item-newDiscussion, .IndexPage-newDiscussion') ? '' : 'none'; }
  }, 400);
})();
</script>


<script>
/* 登录后在顶部右侧放「用户名 · 退出」链接（用户菜单已被 CSS 隐藏，避免无法登出） */
(function(){
  setInterval(function(){
    if(typeof app === 'undefined' || !app.session || !app.session.user) return;
    var sec = document.querySelector('.Header-secondary');
    if(sec && !sec.querySelector('.kv-logout')){
      var li = document.createElement('li');
      li.className = 'kv-logout';
      var uname = '';
      try { uname = app.session.user.username(); } catch(e){}
      var a = document.createElement('a');
      a.href = '/logout?token=' + app.session.csrfToken;
      a.textContent = (uname ? uname + ' · ' : '') + '退出';
      li.appendChild(a);
      sec.appendChild(li);
    }
  }, 500);
})();
</script>


<script>
/* 帖子行：用内联样式强制四列(优先级最高,压过CSS) + 最后发帖改「时间 由 用户名 发布」*/
(function(){
  setInterval(function(){
    document.querySelectorAll('.DiscussionListItem-content').forEach(function(c){
      var main = c.querySelector('.DiscussionListItem-main');
      var title = c.querySelector('.DiscussionListItem-title');
      var count = c.querySelector('.DiscussionListItem-count');
      var views = c.querySelector('.item-discussion-views');
      var terminal = c.querySelector('.item-terminalPost');
      // 彻底确定性布局：把 4 个单元格按顺序直接挂到 content 下
      // (DOM 顺序 = flex 从左到右)，不再依赖 display:contents / order
      // 只有当顺序被打乱时才重排(避免每次轮询都动 DOM 造成闪烁/抖动)
      var ordered = main && count && views && terminal &&
        main.parentElement === c &&
        count.previousElementSibling === main &&
        views.previousElementSibling === count &&
        terminal.previousElementSibling === views;
      if(!ordered && main && count && views && terminal){
        c.style.setProperty('display','flex','important');
        main.style.display = '';
        c.appendChild(main);       // 1) 标题区
        c.appendChild(count);      // 2) 回复
        c.appendChild(views);      // 3) 浏览量
        c.appendChild(terminal);   // 4) 最后一篇帖子
        // 内联 !important 强制每列位置/宽度(压过一切 CSS，含 Flarum 的 position:absolute 气泡)
        main.style.setProperty('order','1','important');
        main.style.setProperty('flex','1 1 auto','important');
        main.style.setProperty('min-width','0','important');
        count.style.setProperty('position','static','important');
        count.style.setProperty('order','2','important');
        count.style.setProperty('flex','0 0 70px','important');
        count.style.setProperty('margin','0','important');
        count.style.setProperty('display','flex','important');
        count.style.setProperty('align-items','center','important');
        count.style.setProperty('justify-content','center','important');
        count.style.setProperty('background','none','important');
        count.style.setProperty('box-shadow','none','important');
        count.style.setProperty('top','auto','important');
        count.style.setProperty('right','auto','important');
        views.style.setProperty('position','static','important');  // 关键:插件把它设成了 absolute
        views.style.setProperty('top','auto','important');
        views.style.setProperty('right','auto','important');
        views.style.setProperty('order','3','important');
        views.style.setProperty('flex','0 0 90px','important');
        views.style.setProperty('display','flex','important');
        views.style.setProperty('align-items','center','important');
        views.style.setProperty('justify-content','center','important');
        terminal.style.setProperty('order','4','important');
        terminal.style.setProperty('flex','0 0 240px','important');
        terminal.style.setProperty('text-align','left','important');
      }
      // 标题后加「由 发帖人」(仿图三 Arch: Title by username)，填充话题列
      var author = c.querySelector('.DiscussionListItem-author');
      if(title && author && !title.querySelector('.kv-by')){
        var al = (author.getAttribute('aria-label') || '').trim();
        var starter = al.split('发布')[0].trim();
        if(!starter) starter = al.split(/\s+/)[0];
        if(starter){
          var by = document.createElement('span');
          by.className = 'kv-by';
          by.textContent = ' 由 ' + starter;
          title.appendChild(by);
        }
      }
      // 列位置由 CSS(order/flex-basis)接管，这里不再设内联 grid 样式
      // 最后发帖改成：时间 由 用户名 发布
      if(terminal && !terminal.querySelector('.kv-lp-user')){
        var time = terminal.querySelector('time');
        var unameEl = terminal.querySelector('.username');
        if(time && unameEl){
          var uname = unameEl.textContent.trim();
          terminal.innerHTML = '';
          terminal.appendChild(time);
          terminal.appendChild(document.createTextNode(' 由 '));
          var u = document.createElement('span');
          u.className = 'username kv-lp-user';
          u.textContent = uname;
          terminal.appendChild(u);
          terminal.appendChild(document.createTextNode(' 发布'));
        }
      }
    });
  }, 500);
})();
</script>
