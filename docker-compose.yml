services:
  flarum:
    # 注意：初次用 mondedie/flarum:stable 部署(Flarum 1.3.0)，后在容器内 composer
    # 升级到 1.8.19 并装扩展，再 docker commit 成 flarum-local:1.8.19 快照固化。
    # 以后改动后记得重新 commit 快照。
    image: flarum-local:1.8.19
    container_name: flarum
    restart: unless-stopped
    ports:
      # 只绑定到本机回环，不直接暴露公网；流量经 Cloudflare Tunnel / Caddy 进入
      - "127.0.0.1:8888:8888"
    environment:
      DEBUG: "false"
      # 论坛对外地址（务必与实际访问域名一致，否则静态资源/登录会异常）
      FORUM_URL: "https://kvin.de5.net"
      # 复用现有 halo-mysql（同在 halo_default 网络，用容器名作主机名）
      DB_HOST: "halo-mysql"
      DB_PORT: "3306"
      DB_NAME: "flarum"
      DB_USER: "flarum"
      DB_PASS: "QhnPvBrWzwxzaVhm4sfbFmN6"
      DB_PREF: "flarum_"
      # 初次启动自动创建的管理员账号
      FLARUM_ADMIN_USER: "admin"
      FLARUM_ADMIN_PASS: "gi49oXGiXRmQWjFmv3"
      FLARUM_ADMIN_MAIL: "admin@kvin.de5.net"
      FLARUM_TITLE: "kvin 论坛"
    volumes:
      - ./data/assets:/flarum/app/public/assets
      - ./data/extensions:/flarum/app/extensions
      - ./data/storage/logs:/flarum/app/storage/logs
      # 预留：自定义主题扩展开发目录（代码放宿主机，运行在容器内）
      # 后面要深度改组件时，把扩展源码放到宿主机 ./theme/，
      # 再用 composer path 仓库注册即可（届时我帮你搭好脚手架）
      - ./theme:/flarum/app/theme
    networks:
      - halo_default

networks:
  # 复用 Halo 已创建的网络，才能连到 halo-mysql
  halo_default:
    external: true
